name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test:
    name: Gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  macos:
    name: macOS package
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Package
        run: ./scripts/package-macos.sh

      - name: Smoke test
        run: |
          "./dist/Edu Scheduler.app/Contents/MacOS/edu-scheduler" --version

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edu-scheduler-macos
          path: |
            dist/*.dmg
            dist/*.app.zip

  linux:
    name: Linux package
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev pkg-config dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Package
        run: ./scripts/package-linux.sh

      - name: Smoke test
        run: |
          ./target/release/edu-scheduler --version
          dpkg-deb --info dist/*.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edu-scheduler-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
